name: Fetch Champion Overworld Sources

on:
  push:
    paths:
      - ".github/workflows/fetch-champion-overworlds.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch credited Pokengine overworld sheets
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p champion-overworld-sources
          curl -fL --retry 3 -o champion-overworld-sources/diantha.webp https://pokengine.b-cdn.net/play/images/trainers/overworlds/018pukjr.webp
          curl -fL --retry 3 -o champion-overworld-sources/leon.webp https://pokengine.b-cdn.net/play/images/trainers/overworlds/011rh3ku.webp
          curl -fL --retry 3 -o champion-overworld-sources/nemona.webp https://pokengine.b-cdn.net/play/images/trainers/overworlds/01l3qido.webp
          curl -fL --retry 3 -o champion-overworld-sources/volo.webp https://pokengine.b-cdn.net/play/images/trainers/overworlds/01jbrd82.webp
          file champion-overworld-sources/*
          identify champion-overworld-sources/*.webp || true
      - name: Upload source sheets
        uses: actions/upload-artifact@v4
        with:
          name: champion-overworld-sources
          path: champion-overworld-sources/
