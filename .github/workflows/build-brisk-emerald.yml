name: Build Pokemon Brisk Emerald

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The legality database must match the *compiled* species rules.
      # Changing a Pokemon's abilities, learnset, or evolution tables makes
      # the checked-in snapshot stale, so reconstruct it before auditing.
      - name: Install ARM tools and Python rule exporter
        timeout-minutes: 30
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libpng-dev \
            gcc-arm-none-eabi \
            binutils-arm-none-eabi
          python3 -m pip install --user pyelftools

      - name: Build Emerald
        run: make -j$(nproc)

      - name: Refresh trainer legality from compiled Emerald data
        run: python3 tools/brisk/export_trainer_legality.py pokeemerald.elf

      - name: Audit trainer progression
        run: python3 tools/brisk/check_trainer_progression.py

      - name: Audit every fixed trainer for evolution legality and Easy balance
        run: |
          python3 tools/brisk/check_trainer_legality.py
          python3 tools/brisk/test_trainer_legality.py

      - name: Audit ordinary/story trainer fairness and dedication exemptions
        run: python3 tools/brisk/check_trainer_fairness.py

      - name: Check every trainer's difficulty plan
        run: python3 tools/brisk/trainer_mode_plan.py --check

      - name: Audit explicit Easy Normal Hard and Kaizo rosters
        run: python3 tools/brisk/author_mode_teams.py --check

      - name: Audit Mega Stone and mint distribution
        run: |
          python3 tools/brisk/check_item_distribution.py
          python3 tools/brisk/check_custom_mega_stones.py

      - name: Audit Kanto postgame teams, dialogue, and legendary relocations
        run: python3 tools/brisk/check_kanto_postgame.py
      - name: Audit Orange Islands to Kanto passage
        run: python3 tools/brisk/check_kanto_connection.py

      - name: Audit emitted Kanto actors, unique dialogue and postgame encounters
        run: python3 tools/brisk/check_kanto_content.py

      - name: Verify stale trainer caches cannot ship old parties
        run: python3 tools/brisk/check_trainer_header.py

      - name: Rename ROM
        run: |
          if [ ! -f "pokeemerald.gba" ]; then
            echo "ERROR: pokeemerald.gba was not created."
            echo "GBA files found:"
            find . -type f -name "*.gba" -ls
            exit 1
          fi

          echo "Built ROM:"
          ls -lh pokeemerald.gba

          cp pokeemerald.gba "Pokemon Brisk Emerald.gba"

          echo "Final ROM:"
          ls -lh "Pokemon Brisk Emerald.gba"

      - name: Upload GBA
        uses: actions/upload-artifact@v4
        with:
          name: Pokemon-Brisk-Emerald
          path: Pokemon Brisk Emerald.gba
          if-no-files-found: error
